run_name: pile4l-ref6m-freq6p6em5-baseline-800k
cadence:
  train_log_every: 200
  checkpointing:
    kind: periodic
    save_every: 5000
    retention:
      kind: keep_last
      n: 2
data:
  train:
    kind: name
    name: pile_neox_tok_512
  eval:
    kind: name
    name: pile_neox_tok_512_val
eval:
  batch_size: 128
  every: 1000
  metrics:
  - n_batches_accum: 1
    type: CIHistograms
  - ci_alive_threshold: 0.0
    type: ComponentActivationDensity
  - ci_alive_threshold: 0.0
    groups:
      layer_0:
      - h.0.*
      layer_1:
      - h.1.*
      layer_2:
      - h.2.*
      layer_3:
      - h.3.*
      total:
      - '*'
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: CIMeanPerComponent
  - init: random
    source_shape: c
    n_steps: 20
    name: PGDReconLoss_20step
    step_size: 0.1
    hidden_acts_reconstruction:
      coeff: 0.0
      points:
      - resid.1
      - resid.2
      - resid.3
      - resid.4
    type: PGDReconLoss
  n_steps: 1
  slow_every: 10000
  slow_on_first_step: true
decomposition:
  sites:
    kind: simple_mlp
    layers:
      kind: all
    cs:
      q_proj: 768
      k_proj: 768
      v_proj: 768
      o_proj: 768
      c_fc: 3072
      down_proj: 3072
    initialization: neuron_aligned
  ci:
    type: chunkwise_transformer
    blocks_per_chunk: 4
    input_tap: all_block_resids
    d_model: 2048
    n_blocks: 8
    attention:
      kind: mha
      n_heads: 16
    ffn:
      kind: gelu
      hidden: 8192
pd:
  seed: 0
  batch_size: 64
  steps: 800000
  ci_fn_optimizer:
    type: muon
    impl: stacked
    consistent_rms: 0.2
    grad_clip_norm: 1.0
    lr_schedule: &id001
      max_val: 5.0e-05
      points:
      - at: 0.0
        frac: 1.0
      - at: 0.9
        frac: 0.1
        interp: cosine
      - at: 1.0
        frac: 0.1
  components_optimizer:
    type: muon
    impl: stacked
    consistent_rms: 0.2
    grad_clip_norm: 1.0
    lr_schedule: *id001
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 0
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - frequency:
      coeff: 6.6e-05
      reference_datapoint_count: 6553600
      ema_halflife_steps: 200
    coeff: 0.0002
    type: ImportanceMinimalityLoss
    gamma:
      max_val: 1.0
      points:
      - at: 0.0
        frac: 1.0
      - at: 0.9
        frac: 0.01
      - at: 1.0
        frac: 0.01
  - type: NonlinearityLocalityLoss
    coeff: 3.0e-05
    relative_threshold:
      max_val: 8.0
      points:
      - at: 0.0
        frac: 1.0
      - at: 1.0
        frac: 0.25
    unit_kind_coefficients:
      neuron: 1.0
      attention_head: 1.0
  - type: MergedStochasticSubsetPPGDReconLoss
    coeff: 1.0
    adv_fraction: 0.5
    n_warmup_steps: 2
    routing:
      type: uniform_k_subset
    optimizer:
      beta1: 0.01
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        max_val: 0.01
        points:
        - at: 0.0
          frac: 0.0
        - at: 0.025
          frac: 1.0
        - at: 1.0
          frac: 1.0
      type: adam
    source_shape: bsc
  - coeff: 1000.0
    type: FaithfulnessLoss
runtime:
  compilation_cache_dir: ~/.cache/param-decomp/xla
  remat_recon_forwards: false
  remat_ci_fn: false
  replicate: 1
  fsdp: 8
  tp: 1
  sharding: zero1
  compiler_options: tuned-v1
target:
  attention_implementation: auto
  weights_dtype: bfloat16
  spec:
    kind: pretrained
    model_class: param_decomp.experiments.lm.pretrain.models.llama_simple_mlp.LlamaSimpleMLP
    run_path: goodfire/spd/runs/t-9d2b8f02
wandb:
  entity: null
  project: param-decomp
  group: task-1274-ref6m
  tags:
  - task-1274
  - ref6m
  - freq6p6em5
  - baseline-800k
